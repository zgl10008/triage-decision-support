
# 服务配置文件
# 统一管理服务端口、路径与运行参数

# 网络公共配置：集中管理监听地址、回环访问地址、协议前缀等易变参数
[network_defaults]
all_interfaces_host = 0.0.0.0
loopback_host = 127.0.0.1
browser_access_host = localhost
loopback_ipv4_prefix = 127.
http_scheme = http

# 灾害现场伤情智能匹配服务（对应 app.py）
[match_service]
ipAddress = 0.0.0.0
port = 5800
knowledge_file_path = data/emergency_injuries.csv
similarity_threshold = 0.18
match_margin = 0.03
top_k = 3
name_weight = 0.3
max_advice_lines = 8

# 多模态融合配置：视觉证据（视频/图像）→ RAG 检索与生成融合
[fusion_service]
# 视觉候选置信度阈值：文本拒答时，视觉置信度 >= 该值才允许视觉兜底给出结论
visual_hit_threshold = 0.7
# RRF 融合常数 k：控制文本/视觉排序融合的平滑程度
rrf_k = 60
# 实体归一化阈值：VLM 候选名与知识库伤情名的字符相似度低于该值则丢弃
normalize_threshold = 0.6

# 本地大模型Ollama服务配置
[ollama_service]
ipAddress = 127.0.0.1
port = 11434
api_path = /api/generate
model_name = deepseek-r1:1.5b
request_timeout = 120

# 混合检索服务配置（阶段2：BGE-M3 dense+sparse+char-TF-IDF 三路 RRF 融合）
[retrieval_service]
# 检索模式：hybrid（BGE-M3 三路 RRF，默认）/ tfidf（字符级 TF-IDF 双通道，回退）
mode = hybrid
# 混合模式判定阈值：Top-1 dense 语义相似度（[0,1]），评测集实证标定
# （offtopic 相似度 max=0.59，真实匹配 min=0.525，取 0.55 为最佳平衡点）
hybrid_threshold = 0.55
# BGE-M3 混合检索索引与模型本地路径（相对脚本目录，无硬编码绝对路径）
index_path = kb/index/recall
model_path = models/bge-m3

# APACHE II 病情预测服务
[apache_ii_service]
ipAddress = 127.0.0.1
port = 5000

# 急救视觉分析服务（对应 analyzer.py）
[analyzer_service]
ipAddress = 0.0.0.0
port = 6800
threaded = true
max_workers = 8
dashscope_api_key =
# 视觉大模型名称（需账号已开通；qwen-vl-max-latest 若未开通会返回 access_denied）
vl_model_name = qwen-vl-plus

# 3008型号蓝牙设备服务
[bluetooth_3008_service]
ipAddress = 0.0.0.0
port = 7800

# 3009型号蓝牙设备服务
[bluetooth_3009_service]
ipAddress = 0.0.0.0
port = 7801

# 3007型号蓝牙设备服务
[bluetooth_3007_service]
ipAddress = 0.0.0.0
port = 7802

# 3009型号蓝牙设备服务
[bluetooth_2887_service]
ipAddress = 0.0.0.0
port = 7887

# 3050型号蓝牙设备服务
[bluetooth_3050_service]
ipAddress = 0.0.0.0
port = 7850

# 3051型号蓝牙设备服务
[bluetooth_3051_service]
ipAddress = 0.0.0.0
port = 7851

# 自适应 Agentic RAG 管线配置（阶段4：Situation/Evidence 判断 + 自适应重检索 + 失败重规划）
[agentic_service]
# 默认管线：baseline（原固定管线，向后兼容）/ agentic（自适应管线）
default_pipeline = baseline
# 全局安全限制：所有循环必须有次数上限 + timeout + fallback
# 整个请求的全局重检索次数（initial + retry 共 <= max_retrieval_retry + 1 次，请求级共享预算）
max_retrieval_retry = 1
# 最多允许重新规划次数（0=禁止 replan；1=最多一次，语义是「最多几次」而非「最多执行几轮」）
max_replan = 1
# 单次请求最多 agent 动作步数（在执行下一步前检查，超限即中止）
max_agent_steps = 8
agent_timeout = 30
llm_timeout = 30
# 快路径：dense 余弦 >= fast_path_threshold 且 top1-top2 gap >= fast_path_gap 时跳过判断 LLM
fast_path_threshold = 0.65
fast_path_gap = 0.10
# 证据灰区下界：dense 在 [evidence_low, hybrid_threshold) 之间 → 可 rewrite 重试
evidence_low = 0.50
# 候选冲突：top1-top2 dense gap < conflict_gap 且伤情不同 → 冲突，即使 dense>=阈值也不硬答
conflict_gap = 0.03
# 验证阶段超时（秒）：超时保守拒答，不放行未验证的高风险建议
verification_timeout = 15
