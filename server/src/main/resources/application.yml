server:
  port: 8014
  servlet:
    encoding:
      force: true
      charset: UTF-8
      enabled: true
  tomcat:
    uri-encoding: UTF-8
spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:triage_support}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.checkclassification.pojo.entity
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

xf:
  appid: "${XF_APPID:}"
  apikey: "${XF_API_KEY:}"
  apisecret: "${XF_API_SECRET:}"

ffmpeg:
  command: "${FFMPEG_PATH:ffmpeg}"

knowledge-base:
  csv-path: "../ai-service/data/emergency_injuries.csv"
  txt-path: "../ai-service/data/kb_extract.txt"
  charset: "UTF-8"
